version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"] # Match the Node 22 runtime.
    groups:
      react:
        patterns: [react, react-dom, react-server-dom-webpack, "@types/react", "@types/react-dom"]
      tailwind:
        patterns: [tailwindcss, "@tailwindcss/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
